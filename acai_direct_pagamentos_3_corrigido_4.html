<style>
:root{
  --bg:#100a1f;
  --bg-2:#1a1030;
  --card:#1e1438;
  --card-2:#241a44;
  --border:#33285c;
  --primary:#4c1d95;
  --primary-2:#2e1065;
  --accent:#7c3aed;
  --accent-2:#a855f7;
  --acai:#5b2a8c;
  --text:#ede9fe;
  --text-muted:#a897d1;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent}
.app-wrapper{
  font-family:'Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%, #2a1550 0%, transparent 60%),linear-gradient(160deg,var(--bg),var(--bg-2));
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
h1,h2,h3{font-family:'Fraunces',serif}
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;
  background:linear-gradient(180deg,var(--primary-2),#160a33);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:20px 14px;position:sticky;top:0;height:100vh;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.sidebar .brand .dot{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#000;display:flex;align-items:center;justify-content:center}
.sidebar .brand .dot img{width:100%;height:100%;object-fit:cover}
.sidebar .brand h1{font-size:17px;font-weight:700;letter-spacing:.01em}
.sidebar .brand span{font-size:11px;color:var(--text-muted);display:block;font-family:'Inter'}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:var(--text-muted);font-size:13.5px;font-weight:500;transition:.15s}
.nav a:hover{background:rgba(124,58,237,.15);color:var(--text)}
.nav a.active{background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;box-shadow:var(--shadow)}
.nav a svg{width:17px;height:17px;flex-shrink:0}
.sidebar-footer{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;font-size:11px;color:var(--text-muted)}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--border);background:rgba(15,10,30,.5);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.page-title{font-size:23px;font-weight:700}
.page-sub{color:var(--text-muted);font-size:13px;margin-top:2px}
.content{padding:28px 30px 60px;max-width:1300px}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(150deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-card .label{font-size:12.5px;color:var(--text-muted)}
.stat-card .value{font-size:24px;font-weight:700;margin-top:6px;font-family:'Fraunces'}
.stat-card .hint{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.stat-card .icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--primary));margin-bottom:8px}
.stat-card .icon svg{width:18px;height:18px;color:#fff}
.stat-card[style*="cursor:pointer"]:hover{background:linear-gradient(150deg,var(--card-2),var(--card));transform:translateY(-2px);box-shadow:0 15px 40px rgba(124,58,237,.3)}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--card-2);text-align:left;padding:11px 13px;font-weight:600;color:var(--text-muted);white-space:nowrap}
tbody td{padding:11px 13px;border-top:1px solid var(--border)}
tbody tr:hover{background:rgba(124,58,237,.08)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font-size:13.5px;font-weight:600;transition:.15s}
.btn svg{width:15px;height:15px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(124,58,237,.12)}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.3)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--text-muted)}
input,select,textarea{background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--bg-2);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge-success{background:rgba(34,197,94,.15);color:#4ade80}
.badge-warning{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-danger{background:rgba(239,68,68,.15);color:#f87171}
.badge-info{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-muted{background:rgba(168,151,209,.12);color:var(--text-muted)}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab{padding:9px 15px;color:var(--text-muted);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:linear-gradient(150deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{font-size:18px;margin-bottom:16px;font-weight:700}
.modal-lg{max-width:780px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.text-muted{color:var(--text-muted)}
.text-success{color:#4ade80}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
.text-right{text-align:right}
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card-2);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{border-left-color:var(--danger)}
.empty{text-align:center;color:var(--text-muted);padding:36px 18px;font-size:13.5px}
.menu-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px;color:var(--text)}
.lang-switch{display:flex;gap:6px;padding:0 8px 14px}
.lang-btn{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:.15s}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;border-color:transparent}
.lang-btn:hover:not(.active){background:rgba(124,58,237,.15);color:var(--text)}
#invoiceArea{display:none}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:.15s;background:rgba(124,58,237,.04)}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(124,58,237,.1)}
.dropzone svg{width:34px;height:34px;color:var(--text-muted);margin-bottom:8px}
.dropzone .dz-title{font-weight:600;font-size:14px}
.dropzone .dz-sub{font-size:12px;color:var(--text-muted);margin-top:3px}
.spinner-inline{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.import-table input,.import-table select{padding:6px 8px;font-size:12.5px}
.import-table td{padding:6px 8px;vertical-align:middle}
.import-table .rm-row{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer}
.badge-new{background:rgba(168,85,247,.18);color:#c084fc}
.raw-text-box{max-height:140px;overflow-y:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11.5px;color:var(--text-muted);white-space:pre-wrap;font-family:'IBM Plex Mono',monospace}
@media(max-width:960px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .sidebar{position:fixed;left:-270px;z-index:80;transition:.25s}
  .sidebar.open{left:0}
  .menu-toggle{display:inline-flex!important}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
  .content{padding:18px}
  .topbar{padding:14px 18px}
}
</style>

const HAS_CLOUD_STORAGE = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';

// localStorage é a fonte confiável (funciona sempre, arquivo aberto de onde for).
// window.storage (quando disponível) é usado como camada extra, nunca como única fonte.
function localGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function localSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadData(){
  // 1) sempre tenta localStorage primeiro — é o que garante que nada se perde
  const local = localGet(STORAGE_KEY);
  if(local){
    try{ DATA = JSON.parse(local); }catch(e){ DATA = null; }
  }
  // 2) se não achou nada local, tenta window.storage (compatibilidade com sessões antigas)
  if(!DATA && HAS_CLOUD_STORAGE){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ DATA = JSON.parse(res.value); localSet(STORAGE_KEY, res.value); }
    }catch(e){ /* ignora, segue pro seed */ }
  }
  // 3) só usa dados de exemplo se realmente não existir nada salvo em lugar nenhum
  if(!DATA){ DATA = seedData(); await saveData(); }

  // 4) Garantir que campos críticos existem
  if(!DATA.pagamentosClientes) DATA.pagamentosClientes = [];
}

let saveTimer = null;
async function saveData(){
  const json = JSON.stringify(DATA);
  const okLocal = localSet(STORAGE_KEY, json);
  if(!okLocal) toast('Não foi possível salvar no navegador (verifique permissões)', 'error');
  if(HAS_CLOUD_STORAGE){
    try{ await window.storage.set(STORAGE_KEY, json, false); }catch(e){ /* localStorage já garantiu a gravação */ }
  }
  pushAutoBackup(json);
}
function persist(){ saveData(); }

const AUTOBACKUP_KEY = 'acai_direct_autobackups_v1';
const AUTOBACKUP_MAX = 8;
let autoBackupTimer = null;
function pushAutoBackup(json){
  // debounce: espera 1.5s sem novas alterações antes de gravar uma versão no histórico,
  // pra não empilhar uma cópia a cada tecla digitada
  clearTimeout(autoBackupTimer);
  autoBackupTimer = setTimeout(()=>{
    try{
      let list = JSON.parse(localGet(AUTOBACKUP_KEY) || '[]');
      list.push({ts: new Date().toISOString(), json});
      if(list.length > AUTOBACKUP_MAX) list = list.slice(list.length - AUTOBACKUP_MAX);
      localSet(AUTOBACKUP_KEY, JSON.stringify(list));
    }catch(e){ /* histórico automático é best-effort, não trava o app */ }
  }, 1500);
}
function openAutoBackups(){
  let list = [];
  try{ list = JSON.parse(localGet(AUTOBACKUP_KEY) || '[]'); }catch(e){}
  list = list.slice().reverse();
  const body = document.getElementById('autoBackupList');
  if(!list.length){
    body.innerHTML = '<div class="empty">Ainda não há versões automáticas salvas. Elas aparecem aqui conforme você usa o app.</div>';
  } else {
    body.innerHTML = list.map((b,idx)=>{
      const d = new Date(b.ts);
      const label = d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px">${esc(label)}</span>
        <button class="btn btn-ghost btn-sm" onclick="restoreAutoBackup(${JSON.stringify(list.length-1-idx)})">Restaurar esta versão</button>
      </div>`;
    }).join('');
  }
  openModal('modalAutoBackups');
}
async function restoreAutoBackup(idx){
  try{
    let list = JSON.parse(localGet(AUTOBACKUP_KEY) || '[]');
    const item = list[idx]; if(!item) return;
    if(!confirm('Isso vai voltar os dados pra essa versão salva. Tudo que foi feito depois dela será perdido. Confirma?')) return;
    DATA = JSON.parse(item.json);
    await saveData();
    toast('Versão restaurada!');
    closeModal('modalAutoBackups');
    goTo(currentPage);
  }catch(e){ toast('Erro ao restaurar essa versão','error'); }
}

function exportBackup(){
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'acai_direct_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup baixado!');
}
async function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.produtos)) throw new Error('Arquivo inválido');
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais pelos dados desse backup. Confirma?')) { e.target.value=''; return; }
    DATA = parsed;
    await saveData();
    toast('Backup restaurado!');
    goTo(currentPage);
  }catch(err){
    toast('Erro ao importar backup: ' + (err.message||err), 'error');
  }
  e.target.value = '';
}

/* ================= HELPERS ================= */
function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,10); }
function money(v){ const n=Number(v)||0; return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

}

  const restoreLbl = document.getElementById('restoreBtnLabel'); if(restoreLbl) restoreLbl.textContent = t('Restaurar');
}
function nextCode(list, field, prefix, pad){
  let max=0;
  list.forEach(x=>{ const n=parseInt(String(x[field]||'').replace(/\D/g,''))||0; if(n>max) max=n; });
  return prefix + String(max+1).padStart(pad,'0');
}
function toast(msg, type){
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':'');
  el.textContent=t(msg);
  document.getElementById('toastWrap').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),300);},2600);
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

let topChartInst=null;
function renderDashboard(){
  const hojeStr = new Date().toISOString().slice(0,10);
  const mesStr = new Date().toISOString().slice(0,7);
  const vendasHoje = DATA.vendas.filter(v=>v.data.slice(0,10)===hojeStr);
  const vendasMes = DATA.vendas.filter(v=>v.data.slice(0,7)===mesStr);
  const sum = (arr,f)=>arr.reduce((s,x)=>s+(Number(x[f])||0),0);
  const estoqueAlertas = DATA.produtos.filter(p=>p.ativo && p.estoqueAtual<=p.estoqueMin);
  const recebidoTotal = sum(DATA.vendas,'montanteRecebido');
  const faturadoTotal = sum(DATA.vendas,'totalVenda');
  const consignado = DATA.vendas.filter(v=>(v.restante||0)>0.01);
  const consignadoTotal = sum(consignado,'restante');
  const caixaAberto = DATA.caixas.find(c=>c.status==='Aberto');

  const topMap={};
  DATA.vendas.forEach(v=>(v.itens||[]).forEach(it=>{
    topMap[it.produtoId] = topMap[it.produtoId] || {nome:it.nome, total:0, qtd:0};
    topMap[it.produtoId].total += it.total; topMap[it.produtoId].qtd += it.quantidade;
  }));
  const top = Object.values(topMap).sort((a,b)=>b.total-a.total).slice(0,5);

  const iCart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>';
  const iChart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>';
  const iMoney='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
  const iAlert='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  const iClock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  function stat(icon,label,value,hint,clickFn){
    const clickAttr = clickFn ? `style="cursor:pointer" onclick="${clickFn}"` : '';
    return `<div class="card stat-card" ${clickAttr}><div class="icon">${icon}</div><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||''}</div></div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="grid cols-4">
      ${stat(iCart,'Vendas Hoje',money(sum(vendasHoje,'totalVenda')),vendasHoje.length+' vendas')}
      ${stat(iChart,'Vendas do Mês',money(sum(vendasMes,'totalVenda')),vendasMes.length+' vendas')}
      ${stat(iMoney,'Margem Mês',money(sum(vendasMes,'margemBruta')),'Lucro bruto')}
      ${stat(iAlert,'Alertas Estoque',estoqueAlertas.length,'Produtos abaixo do mínimo')}
      ${stat(iMoney,'Dinheiro Recebido',money(recebidoTotal),'Total já em caixa (histórico)')}
      ${stat(iClock,'Consignado (na rua)',money(consignadoTotal),consignado.length+' venda(s) a receber',"goTo('consignado')")}
      ${stat(iChart,'Total Faturado',money(faturadoTotal),'Recebido + consignado')}
      ${caixaAberto ? stat(iMoney,'Caixa Aberto',money(caixaAberto.saldoFinal),esc(caixaAberto.nome)) : stat(iMoney,'Caixa Aberto','—','')}
    </div>
    <div class="grid cols-2 mt">
      <div class="card">
        <h3 class="mb" style="font-size:16px">Produtos Mais Vendidos</h3>
        ${top.length ? '<canvas id="topChart" height="200"></canvas>' : `<div class="empty">${t('Nenhuma venda registrada ainda')}</div>`}
      </div>
      <div class="card">
        <h3 class="mb" style="font-size:16px">Estoque Crítico</h3>
        <div>${estoqueAlertas.length ? estoqueAlertas.map(p=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--border)"><span>${esc(p.nome)}</span><span class="badge ${p.estoqueAtual<=0?'badge-danger':'badge-warning'}">${p.estoqueAtual} un. · mín ${p.estoqueMin}</span></div>`).join('') : '<div class="empty">Todos os produtos com estoque adequado ✅</div>'}</div>
      </div>
    </div>`;
  if(top.length){
    if(topChartInst) topChartInst.destroy();
    topChartInst = new Chart(document.getElementById('topChart'),{
      type:'bar',
      data:{labels:top.map(t=>t.nome), datasets:[{label:'Total',data:top.map(t=>t.total),backgroundColor:'rgba(124,58,237,.7)',borderColor:'#a855f7',borderWidth:1,borderRadius:6}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#a897d1'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#a897d1'},grid:{color:'rgba(255,255,255,.05)'}}}}
    });
  }
}

async function handleFaturaFile(e){
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('importLoading').style.display='';
  document.getElementById('importLoadingText').textContent=t('Lendo a fatura...');
  try{
    let text='';
    if(file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
      text = await extractPdfText(file);
    } else {
      document.getElementById('importLoadingText').textContent=t('Reconhecendo texto da imagem (OCR)... pode levar um minuto');
      text = await extractImageText(file);
    }
    importRawText = text;
    importRows = parseInvoiceLines(text);
    document.getElementById('importLoading').style.display='none';
    document.getElementById('importStep1').style.display='none';
    document.getElementById('importStep2').style.display='';
    document.getElementById('rawTextBox').textContent = text || '(nenhum texto detectado)';
    if(!importRows.length){
      toast('Não consegui detectar itens automaticamente. Adicione as linhas manualmente.','error');
      addImportRow();
    }
    renderImportRows();
  }catch(err){
    document.getElementById('importLoading').style.display='none';
    toast('Erro ao ler o arquivo: '+(err.message||err),'error');
  }
}
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let full='';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const lines={};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      lines[y] = lines[y] ? lines[y]+' '+it.str : it.str;
    });
    const ys = Object.keys(lines).map(Number).sort((a,b)=>b-a);
    full += ys.map(y=>lines[y]).join('\n') + '\n';
  }
  return full.trim();
}
async function extractImageText(file){
  const url = URL.createObjectURL(file);
  try{
    const { data } = await Tesseract.recognize(url, 'por+fra+eng');
    return data.text || '';
  } finally { URL.revokeObjectURL(url); }
}
// Padrão estruturado: linhas de item terminam em "<QTD> <PRECO> ,XX % <TOTAL> €"
// (formato comum de fatura PT/FR: REF | DESCRIÇÃO | CÓDIGO EAN | LOTE | QTD. | PREÇO | IVA | DESC. | TOTAL)
const INVOICE_SKIP_RE = /^(isento|total|sous-total|subtotal|tva\b|page\b|p[áa]gina|software|atcud|emiss[ãa]o|vencimento|iban|nif\b|matr|cap\.|^via$|vendedor|taxa de iva|incid[êe]ncia|desc\.\s*financeiro|desc\.\s*comercial|observa|^carga$|^descarga$|matr[íi]cula|multibanco|entidade|refer[êe]ncia|montante|condi[çc][õo]es|bens e servi|^ref\.|descri[çc][ãa]o|c[óo]digo ean|^lote\b|^qtd\.|^pre[çc]o|^dcto|^iva\b|total l[íi]quido|total iva)/i;
const INVOICE_TAIL_RE = /(\d+(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)\s*,\d+\s*%\s+(-?[\d.,\s]+)\s*€/;

function parseInvoiceLines(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(INVOICE_SKIP_RE.test(line)) continue;
    const m = line.match(INVOICE_TAIL_RE);
    if(!m) continue;
    const qtd = parseFloat(m[1].replace(',','.'));
    const preco = parseFloat(m[2].replace(',','.'));
    if(isNaN(qtd) || isNaN(preco) || qtd<=0) continue;

    let head = line.slice(0, m.index).trim();
    head = head.replace(/\s*\d{1,10}\s*\/\s*\d{2}-\d{2}-\d{2,4}\s*$/, '').trim(); // remove LOTE (código / dd-mm-aaaa)
    head = head.replace(/\s*\/\s*\d{2}-\d{2}-\d{2,4}\s*$/, '').trim();
    head = head.replace(/\s*\d{2}-\d{4}\s*$/, '').trim(); // remove LOTE no formato mês-ano (ex: 07-2027)
    head = head.replace(/\s*\d{8,14}\s*$/, '').trim(); // remove CÓDIGO EAN

    // junta linhas anteriores que sejam continuação da descrição (item quebrado em 2-3 linhas)
    let j=i-1; const parts=[];
    while(j>=0){
      const pl = lines[j];
      if(!pl || INVOICE_TAIL_RE.test(pl) || INVOICE_SKIP_RE.test(pl)) break;
      parts.unshift(pl); j--;
    }
    let desc = (parts.join(' ') + ' ' + head).replace(/\s+/g,' ').trim();
    desc = desc.replace(/^\d+\s+/, '').trim(); // remove REF numérico do início

    if(!desc || desc.length<2) continue;
    rows.push({ nome: desc.slice(0,90), quantidade: qtd, custoUnitario: +preco.toFixed(2), precoVenda: +(preco*2).toFixed(2), produtoId: matchProduto(desc) });
  }
  return rows.length ? rows : parseInvoiceLinesGeneric(text);
}

function parseInvoiceLinesGeneric(text){
  const rows=[];
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const numRe = /-?\d{1,4}(?:[.,]\d{1,3})?/g;
  lines.forEach(line=>{
    if(/^(total|sous-total|subtotal|tva|ttc|ht\b|date|facture|invoice|page|siret|iban|merci)/i.test(line)) return;
    const nums = line.match(numRe);
    if(!nums || nums.length<2) return;
    const firstNumIdx = line.search(numRe);
    let desc = line.slice(0, firstNumIdx).trim().replace(/[-–:]+$/,'').trim();
    if(desc.length<2) return;
    const parsed = nums.map(n=>parseFloat(n.replace(',','.'))).filter(n=>!isNaN(n) && n>=0);
    if(parsed.length<2) return;
    let total = parsed[parsed.length-1];
    let precoUnit = parsed[parsed.length-2];
    let qtd = parsed.length>=3 ? parsed[0] : (precoUnit>0 ? Math.max(1, Math.round(total/precoUnit)) : 1);
    if(qtd<=0 || qtd>9999) qtd=1;
    if(precoUnit<=0){ precoUnit = qtd>0 ? +(total/qtd).toFixed(2) : total; }
    rows.push({
      nome: desc.slice(0,80),
      quantidade: qtd,
      custoUnitario: +precoUnit.toFixed(2),
      precoVenda: +(precoUnit*2).toFixed(2),
      produtoId: matchProduto(desc)
    });
  });
  return rows;
}
function matchProduto(desc){
  const d = desc.toLowerCase();
  const found = DATA.produtos.find(p=>{
    const n = p.nome.toLowerCase();
    return d.includes(n) || n.includes(d) || d.split(/\s+/).some(w=>w.length>3 && n.includes(w));
  });
  return found ? found.id : null;
}

function removeImportRow(idx){ importRows.splice(idx,1); renderImportRows(); }
function updateImportRow(idx,field,val){
  const r = importRows[idx]; if(!r) return;
  if(field==='quantidade') r.quantidade = parseFloat(val)||0;
  else if(field==='custoUnitario'){ r.custoUnitario = parseFloat(val)||0; if(!r._precoVendaEdited) r.precoVenda = +(r.custoUnitario*2).toFixed(2); }
  else if(field==='precoVenda'){ r.precoVenda = parseFloat(val)||0; r._precoVendaEdited = true; }
  else if(field==='produtoId'){ r.produtoId = val || null; if(val){ const p=DATA.produtos.find(x=>x.id===val); if(p) r.nome=p.nome; } }
  else if(field==='nome') r.nome = val;
  renderImportRows();
}
function confirmImportFatura(){
  const validRows = importRows.filter(r=>r.quantidade>0 && (r.produtoId || r.nome.trim()));
  if(!validRows.length){ toast('Nenhum item válido para importar','error'); return; }
  const fornecedorId = document.getElementById('impFornecedor').value || null;
  const fornecedor = fornecedorId ? DATA.fornecedores.find(f=>f.id===fornecedorId) : null;
  const numeroFatura = document.getElementById('impNumero').value.trim();
  const dataFatura = document.getElementById('impData').value || new Date().toISOString().slice(0,10);
  const atualizarCusto = document.getElementById('impAtualizarCusto').checked;

  validRows.forEach(r=>{
    let p = r.produtoId ? DATA.produtos.find(x=>x.id===r.produtoId) : null;
    if(!p){
      p = {id:uid('p'), codigo:nextCode(DATA.produtos,'codigo','P',3), nome:r.nome.trim(), unidade:'Unidade',
        custoCompra:r.custoUnitario, precoVenda: r.precoVenda>0 ? r.precoVenda : +(r.custoUnitario*2).toFixed(2), estoqueMin:10, estoqueAtual:0, ativo:true};
      DATA.produtos.push(p);
    }
    if(atualizarCusto) p.custoCompra = r.custoUnitario;
    p.estoqueAtual += r.quantidade;
    DATA.entradas.push({id:uid('e'), numero: numeroFatura ? ('FAT-'+numeroFatura+'-'+p.codigo) : nextCode(DATA.entradas,'numero','ENT-',4),
      data: dataFatura, produtoId:p.id, produtoNome:p.nome, quantidade:r.quantidade, custoUnitario:r.custoUnitario,
      totalCompra:+(r.custoUnitario*r.quantidade).toFixed(2), fornecedorId, fornecedorNome: fornecedor?fornecedor.nome:null, fatura:numeroFatura||null});
  });
  persist();
  toast(validRows.length+' item(ns) adicionados ao estoque!');
  closeModal('modalImportFatura');
  estoqueTab='entradas';
  renderEstoque();
}

          </div>

      <h3>📦 Lançamento em Lote — Várias Vendas pro Mesmo Cliente</h3>

        <select id="loteCliente" style="width:100%"><option value="">${t('Consumidor final')}</option></select>

      <div class="table-wrap"><table>
        <thead><tr><th style="width:120px">Data</th><th>Produto</th><th style="width:80px">Qtd</th><th style="width:100px">Preço (€)</th><th style="width:110px">Tipo</th><th style="width:110px">Recebido (€)</th><th style="width:30px"></th></tr></thead>

          <div style="font-size:20px;font-weight:700" id="loteTotal">0,00 €</div>
        </div>

      <div class="row between mt">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalLote')">${t('Cancelar')}</button>
        <button type="button" class="btn btn-primary" onclick="confirmLote()">Confirmar e lançar todas</button>
      </div>
    </div></div>`;
  renderVendasList();
}
function renderVendasList(){
  const de = document.getElementById('fltDe') ? document.getElementById('fltDe').value : '';
  const ate = document.getElementById('fltAte') ? document.getElementById('fltAte').value : '';
  let list = [...DATA.vendas];
  if(de) list = list.filter(v=>v.data.slice(0,10)>=de);
  if(ate) list = list.filter(v=>v.data.slice(0,10)<=ate);
  list.sort((a,b)=>new Date(b.data)-new Date(a.data));
  const el = document.getElementById('vendasList');
  if(!list.length){ el.innerHTML=`<div class="empty">${t('Nenhuma venda registrada')}</div>`; return; }
  el.innerHTML = `<table class="table"><thead><tr><th>${t('Número')}</th><th>${t('Data')}</th><th>${t('Cliente')}</th><th>${t('Tipo')}</th><th>${t('Total')}</th><th>${t('Status')}</th><th></th></tr></thead>
  <tbody>${list.map(v=>{
    const status = v.restante>0.01 ? `<span class="badge badge-warning">Consignado · ${money(v.restante)}</span>` : `<span class="badge badge-success">Pago</span>`;
    return `<tr><td><strong>${esc(v.numero)}</strong></td><td>${fmtDateTime(v.data)}</td><td>${esc(v.clienteNome||'Consumidor final')}</td><td>${esc(v.tipoVenda)}</td><td>${money(v.totalVenda)}</td><td>${status}</td>
    <td class="row" style="gap:4px"><button class="btn btn-ghost btn-sm" onclick='printInvoice("${v.id}")'>${t('Fatura')}</button><button class="btn btn-ghost btn-sm" onclick='editVenda("${v.id}")'>${t('Editar')}</button><button class="btn btn-ghost btn-sm text-danger" onclick='delVenda("${v.id}")'>${t('Excluir')}</button></td></tr>`;
  }).join('')}</tbody></table>`;
}
function fillVendaSelects(){
  document.getElementById('vCliente').innerHTML = `<option value="">${t('Consumidor final')}</option>` + DATA.clientes.map(c=>`<option value="${c.id}">${esc(c.codigo)} · ${esc(c.nome)}</option>`).join('');
  document.getElementById('vProduto').innerHTML = DATA.produtos.filter(p=>p.ativo).map(p=>`<option value="${p.id}" data-preco="${p.precoVenda}" data-nome="${esc(p.nome)}">${esc(p.nome)} — ${money(p.precoVenda)} (${p.estoqueAtual})</option>`).join('');
}
function openVendaModal(){
  editingVendaId=null; cart=[];
  document.getElementById('formVenda').reset();
  document.getElementById('vendaModalTitle').textContent=t('Nova Venda');
  document.getElementById('novoClienteBox').style.display='none';
  fillVendaSelects(); renderCart();
  openModal('modalVenda');
}
function toggleNovoCliente(){ const b=document.getElementById('novoClienteBox'); b.style.display=b.style.display==='none'?'':'none'; }
function salvarNovoCliente(){
  const nome=document.getElementById('ncNome').value.trim();
  if(!nome){ toast('Informe o nome','error'); return; }
  const c={id:uid('c'),codigo:nextCode(DATA.clientes,'codigo','C',3),nome,tipo:'Particular',telefone:document.getElementById('ncTelefone').value.trim(),cidade:'',endereco:'',limiteCredito:0,observacoes:''};
  DATA.clientes.push(c); persist();
  fillVendaSelects(); document.getElementById('vCliente').value=c.id;
  document.getElementById('novoClienteBox').style.display='none';
  toast('Cliente criado!');
}
function addItem(){
  const sel=document.getElementById('vProduto'); const opt=sel.options[sel.selectedIndex]; if(!opt) return;
  const pid=sel.value; const qtd=parseInt(document.getElementById('vQtd').value)||1;
  const ex=cart.find(i=>i.produtoId===pid);
  if(ex) ex.quantidade+=qtd; else cart.push({produtoId:pid,nome:opt.dataset.nome,quantidade:qtd,precoUnit:parseFloat(opt.dataset.preco)||0});
  renderCart();
}
function removeItem(pid){ cart=cart.filter(i=>i.produtoId!==pid); renderCart(); }
function updateCart(pid,field,val){
  const it=cart.find(i=>i.produtoId===pid); if(!it) return;
  if(field==='q') it.quantidade=Math.max(1,parseInt(val)||1);
  if(field==='p') it.precoUnit=parseFloat(val)||0;
  renderTotal();
}
function renderCart(){
  document.getElementById('itensBody').innerHTML = cart.map(i=>`<tr>
    <td>${esc(i.nome)}</td>
    <td><input type="number" min="1" value="${i.quantidade}" style="width:65px" onchange="updateCart('${i.produtoId}','q',this.value)"></td>
    <td><input type="number" step="0.01" value="${i.precoUnit}" style="width:85px" onchange="updateCart('${i.produtoId}','p',this.value)"></td>
    <td>${money(i.quantidade*i.precoUnit)}</td>
    <td><button type="button" class="btn btn-ghost btn-sm text-danger" onclick="removeItem('${i.produtoId}')">✕</button></td>
  </tr>`).join('');
  renderTotal();
}
function cartTotal(){ return cart.reduce((s,i)=>s+i.quantidade*i.precoUnit,0); }
function renderTotal(){ document.getElementById('vTotal').textContent = money(cartTotal()); }
function editVenda(id){
  const v = DATA.vendas.find(x=>x.id===id); if(!v) return;
  editingVendaId=id;
  document.getElementById('formVenda').reset();
  document.getElementById('vendaModalTitle').textContent=t('Editar Venda');
  document.getElementById('novoClienteBox').style.display='none';
  fillVendaSelects();
  document.getElementById('vCliente').value = v.clienteId||'';
  document.getElementById('vTipo').value = v.tipoVenda;
  document.getElementById('vModo').value = v.modoPagamento||'Dinheiro';
  document.getElementById('vRecebido').value = v.montanteRecebido;
  document.getElementById('vObs').value = v.observacoes||'';
  cart = (v.itens||[]).map(it=>({produtoId:it.produtoId,nome:it.nome,quantidade:it.quantidade,precoUnit:it.precoUnit}));
  renderCart();
  openModal('modalVenda');
}
function delVenda(id){
  if(!confirm('Tem certeza que deseja excluir esta venda? O estoque será devolvido.')) return;
  const v = DATA.vendas.find(x=>x.id===id); if(!v) return;
  (v.itens||[]).forEach(it=>{ const p=DATA.produtos.find(x=>x.id===it.produtoId); if(p) p.estoqueAtual += it.quantidade; });
  DATA.vendas = DATA.vendas.filter(x=>x.id!==id);
  persist(); toast('Venda excluída!'); renderVendasList();
}
function submitVenda(e){
  e.preventDefault();
  if(!cart.length){ toast('Adicione ao menos um produto','error'); return; }
  const clienteId = document.getElementById('vCliente').value || null;
  const cliente = clienteId ? DATA.clientes.find(c=>c.id===clienteId) : null;

  if(editingVendaId){
    const v = DATA.vendas.find(x=>x.id===editingVendaId);
    (v.itens||[]).forEach(it=>{ const p=DATA.produtos.find(x=>x.id===it.produtoId); if(p) p.estoqueAtual += it.quantidade; });
    let totalVenda=0, margemBruta=0; const itens=[];
    cart.forEach(i=>{
      const p = DATA.produtos.find(x=>x.id===i.produtoId); if(!p) return;
      const total = +(i.precoUnit*i.quantidade).toFixed(2);
      totalVenda += total; margemBruta += (i.precoUnit-p.custoCompra)*i.quantidade;
      p.estoqueAtual -= i.quantidade;
      itens.push({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,precoUnit:i.precoUnit,total});
    });
    const recebidoRaw=document.getElementById('vRecebido').value;
    const montanteRecebido = recebidoRaw==='' ? 0 : parseFloat(recebidoRaw)||0;
    const restante = Math.max(0, +(totalVenda-montanteRecebido).toFixed(2));
    Object.assign(v,{clienteId, clienteNome: cliente?cliente.nome:null, totalVenda:+totalVenda.toFixed(2), montanteRecebido, restante,
      tipoVenda:document.getElementById('vTipo').value, modoPagamento:document.getElementById('vModo').value,
      margemBruta:+margemBruta.toFixed(2), observacoes:document.getElementById('vObs').value.trim(), itens, pago:restante<=0.001});
    toast('Venda atualizada!');
  } else {
    let totalVenda=0, margemBruta=0; const itens=[];
    cart.forEach(i=>{
      const p = DATA.produtos.find(x=>x.id===i.produtoId); if(!p) return;
      const total = +(i.precoUnit*i.quantidade).toFixed(2);
      totalVenda += total; margemBruta += (i.precoUnit-p.custoCompra)*i.quantidade;
      p.estoqueAtual -= i.quantidade;
      itens.push({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,precoUnit:i.precoUnit,total});
    });
    const recebidoRaw=document.getElementById('vRecebido').value;
    const montanteRecebido = recebidoRaw==='' ? totalVenda : parseFloat(recebidoRaw)||0;
    const restante = Math.max(0, +(totalVenda-montanteRecebido).toFixed(2));
    DATA.vendas.push({id:uid('v'),numero:nextCode(DATA.vendas,'numero','V-',4),data:new Date().toISOString(),
      clienteId, clienteNome: cliente?cliente.nome:null, totalVenda:+totalVenda.toFixed(2), montanteRecebido, restante,
      tipoVenda:document.getElementById('vTipo').value, pago:restante<=0.001, modoPagamento:document.getElementById('vModo').value,
      margemBruta:+margemBruta.toFixed(2), observacoes:document.getElementById('vObs').value.trim(), origem:'Balcao', itens});
    toast('Venda registrada!');
  }
  persist(); closeModal('modalVenda'); renderVendasList();
}

  const v = DATA.vendas.find(x=>x.id===id); if(!v) return;
  const linhas = (v.itens||[]).map(it=>`<tr><td>${esc(it.nome)}</td><td style="text-align:center">${it.quantidade}</td><td style="text-align:right">${money(it.precoUnit)}</td><td style="text-align:right">${money(it.total)}</td></tr>`).join('');
  document.getElementById('invoiceArea').innerHTML = `
    <div style="color:#111;background:#fff;max-width:800px;margin:0 auto;padding:32px;font-size:14px">
      <div style="display:flex;justify-content:space-between;border-bottom:2px solid #4c1d95;padding-bottom:16px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:10px"><img src="${LOGO_DATA_URI}" style="width:44px;height:44px;border-radius:50%;object-fit:cover"><h1 style="color:#4c1d95;margin:0">Açaí Direct</h1></div>
        <div style="text-align:right"><h2>Fatura ${esc(v.numero)}</h2><div style="color:#666;font-size:12px">${fmtDateTime(v.data)}</div></div>
      </div>
      <div style="margin-bottom:16px"><strong>${t('Cliente:')}</strong> ${esc(v.clienteNome||'Consumidor final')}<br><strong>${t('Tipo:')}</strong> ${esc(v.tipoVenda)}</div>
      <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f5f3ff"><th style="text-align:left;padding:8px">${t('Produto')}</th><th style="padding:8px">${t('Qtd')}</th><th style="text-align:right;padding:8px">${t('Preço')}</th><th style="text-align:right;padding:8px">${t('Total')}</th></tr></thead><tbody>${linhas}</tbody></table>
      <div style="margin-left:auto;width:280px;margin-top:16px">
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>${t('Total')}</span><strong>${money(v.totalVenda)}</strong></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>${t('Recebido')}</span><strong>${money(v.montanteRecebido)}</strong></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>${t('Consignado')}</span><strong>${money(v.restante)}</strong></div>
      </div>
    </div>`;
  document.body.classList.add('printing');
  const style=document.createElement('style');

/* ================= LANÇAMENTO EM LOTE ================= */
let loteRows = [];
function openLoteModal(){
  loteRows = [];
  document.getElementById('loteCliente').innerHTML = `<option value="">${t('Consumidor final')}</option>` +
    DATA.clientes.map(c=>`<option value="${c.id}">${esc(c.codigo)} · ${esc(c.nome)}</option>`).join('');
  addLoteRow();
  openModal('modalLote');
}
function addLoteRow(){
  loteRows.push({
    data: new Date().toISOString().slice(0,10),
    produtoId: DATA.produtos[0] ? DATA.produtos[0].id : '',
    quantidade: 1,
    precoUnit: DATA.produtos[0] ? DATA.produtos[0].precoVenda : 0,
    tipoVenda: 'Pronto',
    montanteRecebido: null,
  });
  renderLoteRows();
}
function removeLoteRow(idx){ loteRows.splice(idx,1); renderLoteRows(); }
function updateLoteRow(idx, field, val){
  const r = loteRows[idx]; if(!r) return;
  if(field==='quantidade') r.quantidade = parseFloat(val)||0;
  else if(field==='precoUnit') r.precoUnit = parseFloat(val)||0;
  else if(field==='montanteRecebido') r.montanteRecebido = val==='' ? null : parseFloat(val)||0;
  else if(field==='produtoId'){
    r.produtoId = val;
    const p = DATA.produtos.find(x=>x.id===val);
    if(p) r.precoUnit = p.precoVenda;
  }
  else r[field] = val;
  renderLoteRows();
}
function renderLoteRows(){
  const body = document.getElementById('loteRowsBody');
  body.innerHTML = loteRows.map((r,idx)=>{
    const prodOptions = DATA.produtos.map(p=>`<option value="${p.id}" ${r.produtoId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('');
    return `<tr>
      <td><input type="date" value="${r.data}" onchange="updateLoteRow(${idx},'data',this.value)"></td>
      <td><select onchange="updateLoteRow(${idx},'produtoId',this.value)">${prodOptions}</select></td>
      <td><input type="number" min="1" value="${r.quantidade}" onchange="updateLoteRow(${idx},'quantidade',this.value)"></td>
      <td><input type="number" min="0" step="0.01" value="${r.precoUnit}" onchange="updateLoteRow(${idx},'precoUnit',this.value)"></td>
      <td><select onchange="updateLoteRow(${idx},'tipoVenda',this.value)">
        <option value="Pronto" ${r.tipoVenda==='Pronto'?'selected':''}>${t('Pronto')}</option>
        <option value="Consignado" ${r.tipoVenda==='Consignado'?'selected':''}>${t('Consignado')}</option>
        <option value="Entrega" ${r.tipoVenda==='Entrega'?'selected':''}>${t('Entrega')}</option>
      </select></td>
      <td><input type="number" min="0" step="0.01" placeholder="total" value="${r.montanteRecebido===null?'':r.montanteRecebido}" onchange="updateLoteRow(${idx},'montanteRecebido',this.value)"></td>
      <td><button type="button" class="rm-row" onclick="removeLoteRow(${idx})">✕</button></td>
    </tr>`;
  }).join('');
  const total = loteRows.reduce((s,r)=>s+r.quantidade*r.precoUnit,0);
  document.getElementById('loteTotal').textContent = money(total);
  document.getElementById('loteResumo').textContent = loteRows.length + ' venda(s) nesse lote';
}
function confirmLote(){
  const validRows = loteRows.filter(r=>r.produtoId && r.quantidade>0);
  if(!validRows.length){ toast('Adicione ao menos uma venda válida','error'); return; }
  const clienteId = document.getElementById('loteCliente').value || null;
  const cliente = clienteId ? DATA.clientes.find(c=>c.id===clienteId) : null;

  let criadas = 0;
  validRows.forEach(r=>{
    const p = DATA.produtos.find(x=>x.id===r.produtoId); if(!p) return;
    const total = +(r.precoUnit*r.quantidade).toFixed(2);
    const margemBruta = +((r.precoUnit-p.custoCompra)*r.quantidade).toFixed(2);
    const montanteRecebido = r.montanteRecebido===null ? total : r.montanteRecebido;
    const restante = Math.max(0, +(total-montanteRecebido).toFixed(2));
    DATA.vendas.push({
      id: uid('v'), numero: nextCode(DATA.vendas,'numero','V-',4),
      data: new Date(r.data+'T12:00:00').toISOString(),
      clienteId, clienteNome: cliente?cliente.nome:null,
      totalVenda: total, montanteRecebido, restante,
      tipoVenda: r.tipoVenda, pago: restante<=0.001, modoPagamento: 'A definir',
      margemBruta, observacoes: 'Lançado em lote', origem: 'Balcao',
      itens: [{produtoId:p.id, nome:p.nome, quantidade:r.quantidade, precoUnit:r.precoUnit, total}],
    });
    p.estoqueAtual -= r.quantidade;
    criadas++;
  });
  persist();
  toast(criadas + ' venda(s) lançada(s)!');
  closeModal('modalLote');
  renderVendasList();
}

        <div><div class="text-muted" style="font-size:12px">${t('Entradas')}</div><div class="text-success">${money(aberto.totalEntradas)}</div></div>
        <div><div class="text-muted" style="font-size:12px">${t('Saídas')}</div><div class="text-danger">${money(aberto.totalSaidas)}</div></div>

function openAbrirModal(){ openModal('modalAbrir'); }
function submitAbrir(e){
  e.preventDefault();
  const vi = parseFloat(document.getElementById('cxValor').value)||0;
  DATA.caixas.push({id:uid('cx'),nome:document.getElementById('cxNome').value.trim()||'Caixa',dataAbertura:new Date().toISOString(),dataFechamento:null,
    valorInicial:vi,totalEntradas:0,totalSaidas:0,saldoFinal:vi,status:'Aberto',itens:[]});
  persist(); toast('Caixa aberto!'); closeModal('modalAbrir'); renderCaixa();
}
function openVRModal(){
  document.getElementById('vrProduto').innerHTML = `<option value="">${t('Sem produto (avulso)')}</option>` + DATA.produtos.map(p=>`<option value="${p.id}" data-preco="${p.precoVenda}">${esc(p.nome)} — ${money(p.precoVenda)}</option>`).join('');
  document.getElementById('vrQtd').value=1;
  openModal('modalVR');
}
function submitVR(e){
  e.preventDefault();
  const aberto = DATA.caixas.find(c=>c.status==='Aberto'); if(!aberto) return;
  const sel=document.getElementById('vrProduto'); const opt=sel.options[sel.selectedIndex];
  const qtd=parseInt(document.getElementById('vrQtd').value)||1;
  const preco=parseFloat(document.getElementById('vrPreco').value)||0;
  const total=+(preco*qtd).toFixed(2);
  aberto.itens = aberto.itens||[];
  aberto.itens.unshift({id:uid('ic'),descricao: sel.value? opt.text : 'Venda rápida', quantidade:qtd, precoUnit:preco, total, tipo:'Entrada'});
  if(sel.value){ const p=DATA.produtos.find(x=>x.id===sel.value); if(p) p.estoqueAtual -= qtd; }
  aberto.totalEntradas += total; aberto.saldoFinal += total;
  persist(); toast('Venda registrada!'); closeModal('modalVR'); renderCaixa();
}
function openSaidaModal(){ openModal('modalSaida'); }
function submitSaida(e){
  e.preventDefault();
  const aberto = DATA.caixas.find(c=>c.status==='Aberto'); if(!aberto) return;
  const total = parseFloat(document.getElementById('saValor').value)||0;
  aberto.itens = aberto.itens||[];
  aberto.itens.unshift({id:uid('ic'),descricao:document.getElementById('saDesc').value.trim(),quantidade:1,precoUnit:total,total,tipo:'Saída'});
  aberto.totalSaidas += total; aberto.saldoFinal -= total;
  persist(); toast('Saída registrada!'); closeModal('modalSaida'); renderCaixa();
}
function fecharCaixa(){
  if(!confirm('Tem certeza que deseja fechar o caixa?')) return;
  const aberto = DATA.caixas.find(c=>c.status==='Aberto'); if(!aberto) return;
  aberto.status='Fechado'; aberto.dataFechamento=new Date().toISOString();
  persist(); toast('Caixa fechado!'); renderCaixa();
}

function attachFacItemListeners(row) {

  });
}

function facCalculateTotals() {
  let totalHT = 0;
  let totalTVA = 0;

  document.querySelectorAll('.fac-item-row').forEach(row => {
    const qty = parseFloat(row.querySelector('.fac-qty').value) || 0;
    const price = parseFloat(row.querySelector('.fac-price').value) || 0;
    const tva = parseFloat(row.querySelector('.fac-tva').value) || 0;

    const lineTotal = qty * price;
    const lineTVA = lineTotal * (tva / 100);

    row.querySelector('.fac-item-total').textContent = lineTotal.toFixed(2);

    totalHT += lineTotal;
    totalTVA += lineTVA;
  });

  const totalTTC = totalHT + totalTVA;

  document.getElementById('facTotalHT').value = totalHT.toFixed(2);
  document.getElementById('facTotalTVA').value = totalTVA.toFixed(2);
  document.getElementById('facTotalTTC').value = totalTTC.toFixed(2);
}

function facPopulateProductSelects() {
  const prodOptions = DATA.estoque.map(p => `<option value="${esc(p.nome)}" data-price="${p.preco || 0}">${esc(p.nome)}</option>`).join('');
  document.querySelectorAll('.fac-product-select').forEach(select => {
    const currentValue = select.value;
    select.innerHTML = `<option value="">-- Sélectionner un produit --</option>${prodOptions}<option value="__custom__">✎ Produit Personnalisé</option>`;
    if(currentValue) select.value = currentValue;
    select.addEventListener('change', facOnProductSelect);
  });
}

function facOnProductSelect(e) {
  const row = e.target.closest('.fac-item-row');
  const descInput = row.querySelector('.fac-description');
  const priceInput = row.querySelector('.fac-price');

  if(e.target.value === '__custom__') {
    // Produto customizado
    descInput.style.display = '';
    descInput.value = '';
    priceInput.value = '0.00';
    descInput.focus();
  } else if(e.target.value) {
    // Produto do estoque
    descInput.style.display = 'none';
    descInput.value = e.target.value;
    const price = parseFloat(e.target.options[e.target.selectedIndex].dataset.price) || 0;
    priceInput.value = price.toFixed(2);
  } else {
    // Nenhum selecionado
    descInput.style.display = '';
    descInput.value = '';
  }
  facCalculateTotals();
}

let currentClienteIdPag = null;
let pagamentosTemp = [];

function openPagamentosModal(clienteId, clienteNome){
  currentClienteIdPag = clienteId;
  pagamentosTemp = (DATA.pagamentosClientes || []).filter(p=>p.clienteId===clienteId).sort((a,b)=>new Date(b.data)-new Date(a.data));

  const vendasC = DATA.vendas.filter(v=>v.clienteId===clienteId);
  const totalComprado = vendasC.reduce((s,v)=>s+v.totalVenda,0);
  const totalPagamentos = pagamentosTemp.reduce((s,p)=>s+p.valor,0);
  const saldoDevendo = Math.max(0, totalComprado - totalPagamentos);

  const listaPagamentos = pagamentosTemp.length ?
    pagamentosTemp.map((p,idx)=>`<div style="background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div style="flex:1"><div style="font-weight:600;font-size:14px">${money(p.valor)}</div><div class="text-muted" style="font-size:11px">${fmtDate(p.data)} · ${p.modo}</div></div><button type="button" class="btn btn-danger btn-sm" onclick="removePagamento(${idx})">🗑️</button></div>`).join('')
    : '<div class="empty">Nenhum pagamento registrado ainda</div>';

  const html = `<div style="background:rgba(124,58,237,.1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px"><strong style="font-size:14px">${esc(clienteNome)}</strong><div class="grid cols-3 mt" style="gap:12px"><div><div class="text-muted" style="font-size:11px">Total devido</div><div style="font-size:16px;font-weight:700;color:#d97706">${money(totalComprado)}</div></div><div><div class="text-muted" style="font-size:11px">Já recebido</div><div style="font-size:16px;font-weight:700;color:#16a34a">${money(totalPagamentos)}</div></div><div><div class="text-muted" style="font-size:11px">Falta receber</div><div style="font-size:16px;font-weight:700;color:${saldoDevendo>0.01?'#f87171':'#16a34a'}">${money(saldoDevendo)}</div></div></div></div><div style="margin-bottom:16px"><label style="font-weight:600;margin-bottom:8px;display:block">Adicionar novo pagamento</label><div class="grid cols-3" style="gap:10px;margin-bottom:10px"><div class="field"><label style="font-size:11px">Data</label><input type="date" id="pagData" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label style="font-size:11px">Valor (€)</label><input type="number" step="0.01" id="pagValor" placeholder="0,00" min="0"></div><div class="field"><label style="font-size:11px">Modo</label><select id="pagModo"><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Cheque</option></select></div></div><button type="button" class="btn btn-primary" onclick="addPagamento()" style="width:100%">➕ Adicionar pagamento</button></div><div style="margin-bottom:16px"><label style="font-weight:600;margin-bottom:8px;display:block">Histórico de pagamentos</label><div id="pagamentosLista">${listaPagamentos}</div></div><div class="row between mt" style="border-top:1px solid var(--border);padding-top:14px"><button type="button" class="btn btn-ghost" onclick="closeModal('modalPagamentos')">Fechar</button><button type="button" class="btn btn-primary" onclick="confirmarPagamentos()">✓ Confirmar e aplicar</button></div>`;

  document.getElementById('pagamentosContent').innerHTML = html;
  openModal('modalPagamentos');
}

function addPagamento(){
  const data = document.getElementById('pagData').value;
  const valor = parseFloat(document.getElementById('pagValor').value)||0;
  const modo = document.getElementById('pagModo').value;

  if(!data){ toast('Informe a data','error'); return; }
  if(valor<=0){ toast('Informe um valor válido','error'); return; }

  pagamentosTemp.push({id:uid('pg'),clienteId:currentClienteIdPag,data,valor,modo});
  document.getElementById('pagValor').value='';
  document.getElementById('pagData').value=new Date().toISOString().slice(0,10);
  atualizarListaPagamentos();
  toast('Pagamento adicionado!');
}

function removePagamento(idx){
  pagamentosTemp.splice(idx,1);
  atualizarListaPagamentos();
  toast('Pagamento removido');
}

function atualizarListaPagamentos(){
  const lista = document.getElementById('pagamentosLista');
  if(!lista) return;
  const listaPagamentos = pagamentosTemp.length ?
    pagamentosTemp.map((p,idx)=>`<div style="background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div style="flex:1"><div style="font-weight:600;font-size:14px">${money(p.valor)}</div><div class="text-muted" style="font-size:11px">${fmtDate(p.data)} · ${p.modo}</div></div><button type="button" class="btn btn-danger btn-sm" onclick="removePagamento(${idx})">🗑️</button></div>`).join('')
    : '<div class="empty">Nenhum pagamento registrado ainda</div>';
  lista.innerHTML = listaPagamentos;
}

function confirmarPagamentos(){
  try {
    if(!currentClienteIdPag){ toast('Erro: Cliente não identificado','error'); return; }
    if(!pagamentosTemp || pagamentosTemp.length===0){ toast('Adicione pelo menos um pagamento','error'); return; }

    // Garantir que o array existe
    if(!DATA.pagamentosClientes) DATA.pagamentosClientes = [];

    // Remover pagamentos antigos deste cliente e adicionar novos
    DATA.pagamentosClientes = DATA.pagamentosClientes.filter(p=>p.clienteId!==currentClienteIdPag);
    DATA.pagamentosClientes.push(...pagamentosTemp);

    const totalPagamentos = pagamentosTemp.reduce((s,p)=>s+(p.valor||0),0);
    const vendasC = DATA.vendas.filter(v=>v.clienteId===currentClienteIdPag).sort((a,b)=>new Date(a.data)-new Date(b.data));

    let saldoPendente = totalPagamentos;
    vendasC.forEach(v=>{
      if(saldoPendente>0.01 && v){
        const faltaReceber = Math.max(0,(v.totalVenda||0)-(v.montanteRecebido||0));
        const aplicar = Math.min(saldoPendente,faltaReceber);
        if(aplicar>0){
          v.montanteRecebido = (v.montanteRecebido||0) + aplicar;
          v.restante = Math.max(0, (v.totalVenda||0) - v.montanteRecebido);
          v.pago = v.restante<=0.001;
          saldoPendente = Math.max(0, saldoPendente - aplicar);
        }
      }
    });

    persist();
    closeModal('modalPagamentos');
    renderClientesList();
    toast('✓ Pagamentos aplicados com sucesso!');
  } catch(e) {
    console.error('Erro ao confirmar pagamentos:', e);
    toast('Erro ao aplicar pagamentos: '+e.message,'error');
  }
}

/* ================= CONSIGNADO (NA RUA) ================= */
let consignadoTab = 'customers';
let consignadoViewCustomerId = null;
let consignadoSort = 'saldo'; // 'saldo', 'cliente', 'idade'
let consignadoSearch = '';

function sumArray(arr, field){
  return arr.reduce((s,x)=>s+(Number(x[field])||0),0);
}

function renderConsignado(){
  if(consignadoViewCustomerId){
    renderCustomerDebtDetails(consignadoViewCustomerId);
  } else {
    renderConsignedCustomers();
  }
}

function renderConsignedCustomers(){
  const allConsignado = DATA.vendas.filter(v=>(v.restante||0)>0.01);
  const customerMap = {};

  // Agrupa dados por cliente
  allConsignado.forEach(v=>{
    const cliente = DATA.clientes.find(c=>c.id===v.clienteId);
    if(!cliente) return;
    if(!customerMap[v.clienteId]){
      customerMap[v.clienteId] = {
        id: v.clienteId,
        nome: cliente.nome,
        telefone: cliente.telefone || '',
        codigo: cliente.codigo || '',
        totalConsignado: 0,
        vendas: [],
        minData: null,
        maxData: null
      };
    }
    customerMap[v.clienteId].totalConsignado += (v.restante||0);
    customerMap[v.clienteId].vendas.push(v);
    const vData = new Date(v.data);
    if(!customerMap[v.clienteId].minData || vData < customerMap[v.clienteId].minData)
      customerMap[v.clienteId].minData = vData;
    if(!customerMap[v.clienteId].maxData || vData > customerMap[v.clienteId].maxData)
      customerMap[v.clienteId].maxData = vData;
  });

  let customers = Object.values(customerMap);

  // Filtro por busca
  if(consignadoSearch){
    const q = consignadoSearch.toLowerCase();
    customers = customers.filter(c=>c.nome.toLowerCase().includes(q) || c.telefone.includes(q) || c.codigo.toLowerCase().includes(q));
  }

  // Ordenação
  if(consignadoSort === 'saldo'){
    customers.sort((a,b)=>b.totalConsignado-a.totalConsignado);
  } else if(consignadoSort === 'cliente'){
    customers.sort((a,b)=>a.nome.localeCompare(b.nome));
  } else if(consignadoSort === 'idade'){
    customers.sort((a,b)=>(a.minData||new Date()) - (b.minData||new Date()));
  }

  const totalConsignado = sumArray(allConsignado, 'restante');
  const iClock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

  document.getElementById('content').innerHTML = `
    <div class="row between mb">
      <div>
        <h3 style="font-size:16px;margin-bottom:8px">Clientes com Saldo a Receber</h3>
        <div style="color:var(--text-muted);font-size:13px">Total: <strong style="color:var(--accent)">${money(totalConsignado)}</strong> · <strong>${customers.length}</strong> cliente(s) com débito</div>
      </div>
      <button class="btn btn-ghost" onclick="consignadoViewCustomerId=null;renderConsignado()">${t('Voltar')}</button>
    </div>

    <div class="card mb">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
        <div class="field"><label>${t('Buscar')}</label><input id="consignadoSearch" placeholder="Nome ou telefone..." value="${esc(consignadoSearch)}" oninput="consignadoSearch=this.value;renderConsignedCustomers()"></div>
        <div class="field"><label>${t('Ordenar por')}</label><select id="consignadoSort" value="${consignadoSort}" onchange="consignadoSort=this.value;renderConsignedCustomers()">
          <option value="saldo">Saldo (maior para menor)</option>
          <option value="idade">Data mais antiga</option>
          <option value="cliente">Nome do cliente</option>
        </select></div>
        <div style="display:flex;align-items:flex-end;gap:8px">
          <button class="btn btn-primary" style="flex:1">${t('Gerar Relatório')}</button>
          <button class="btn btn-ghost">${t('Exportar CSV')}</button>
        </div>
      </div>
    </div>

    <div id="consignadoList"></div>
  `;

  renderConsignadoList(customers);
  document.getElementById('consignadoSort').value = consignadoSort;
}

function renderConsignadoList(customers){
  const el = document.getElementById('consignadoList');
  if(!customers.length){
    el.innerHTML = `<div class="empty">${t('Nenhum cliente com saldo a receber')}</div>`;
    return;
  }

  el.innerHTML = customers.map(c=>{
    const diasAtraso = c.minData ? Math.floor((new Date() - c.minData) / (1000*60*60*24)) : 0;
    const vendaCountText = c.vendas.length === 1 ? '1 venda' : c.vendas.length + ' vendas';
    const atrasoClass = diasAtraso > 60 ? 'text-danger' : diasAtraso > 30 ? 'text-warning' : 'text-muted';

    return `<div class="card mb" style="cursor:pointer;transition:.15s" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" onclick="consignadoViewCustomerId='${c.id}';renderConsignado()">

          <div style="font-size:18px;font-weight:700;color:var(--accent)">${money(c.totalConsignado)}</div>
          <div class="text-muted" style="font-size:12px">${vendaCountText}</div>
        </div>
      </div>
      <div class="grid cols-4 mt" style="gap:16px">
        <div>
          <div class="text-muted" style="font-size:12px">Venda mais antiga</div>
          <div style="font-size:13.5px">${c.minData ? fmtDate(c.minData.toISOString()) : '—'}</div>
        </div>
        <div>
          <div class="text-muted" style="font-size:12px">Dias de atraso</div>
          <div style="font-size:13.5px;font-weight:700" class="${atrasoClass}">${diasAtraso} dias</div>

        <div>
          <div class="text-muted" style="font-size:12px">Saldo médio</div>
          <div style="font-size:13.5px">${money(c.totalConsignado / c.vendas.length)}</div>

        <div>
          <div class="text-muted" style="font-size:12px">Clique para ver detalhes</div>
          <div style="font-size:13.5px;color:var(--accent)">→</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

      <div class="field relDt"><label>${t('Até')}</label><input type="date" id="relAte"></div>

    </div></div>
    <div id="relSummary" class="grid cols-3 mb"></div>

function onRelTipo(){
  const isVendas = document.getElementById('relTipo').value==='vendas';
  document.querySelectorAll('.relDt').forEach(el=>el.style.display = isVendas ? '' : 'none');
}
function loadRel(){
  const tipo = document.getElementById('relTipo').value;
  const sum = document.getElementById('relSummary'); const res = document.getElementById('relResult');
  if(relChartInst){ relChartInst.destroy(); relChartInst=null; }
  sum.innerHTML='';
  function card(label,value){ return `<div class="card stat-card"><div class="label">${label}</div><div class="value">${value}</div></div>`; }
  if(tipo==='vendas'){
    const de=document.getElementById('relDe').value, ate=document.getElementById('relAte').value;
    let vs=[...DATA.vendas];
    if(de) vs=vs.filter(v=>v.data.slice(0,10)>=de);
    if(ate) vs=vs.filter(v=>v.data.slice(0,10)<=ate);
    vs.sort((a,b)=>new Date(b.data)-new Date(a.data));
    const total=vs.reduce((s,v)=>s+v.totalVenda,0), recebido=vs.reduce((s,v)=>s+v.montanteRecebido,0), margem=vs.reduce((s,v)=>s+v.margemBruta,0);
    sum.innerHTML = card('Total',money(total))+card('Recebido',money(recebido))+card('Margem',money(margem));
    relCsvRows=[['Numero','Data','Cliente','Tipo','Total','Recebido','Restante']].concat(vs.map(v=>[v.numero,fmtDateTime(v.data),v.clienteNome||'Consumidor final',v.tipoVenda,v.totalVenda,v.montanteRecebido,v.restante]));
    res.innerHTML = vs.length ? `<table class="table"><thead><tr><th>${t('Número')}</th><th>${t('Data')}</th><th>${t('Cliente')}</th><th>${t('Total')}</th><th>${t('Recebido')}</th><th>${t('Consignado')}</th></tr></thead><tbody>${vs.map(v=>`<tr><td>${esc(v.numero)}</td><td>${fmtDateTime(v.data)}</td><td>${esc(v.clienteNome||'Consumidor final')}</td><td>${money(v.totalVenda)}</td><td>${money(v.montanteRecebido)}</td><td>${money(v.restante)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">—</div>';
    const byDay={}; vs.forEach(v=>{ const d=v.data.slice(0,10); byDay[d]=(byDay[d]||0)+v.totalVenda; });
    const labels=Object.keys(byDay).sort();
    buildRelChart(labels.map(fmtDate),[{label:'Vendas',data:labels.map(l=>byDay[l]),backgroundColor:'rgba(124,58,237,.7)',borderRadius:6}]);
  }
  if(tipo==='estoque'){
    const ps = DATA.produtos.filter(p=>p.ativo);
    relCsvRows=[['Codigo','Produto','Estoque','Minimo','Custo','Preco']].concat(ps.map(p=>[p.codigo,p.nome,p.estoqueAtual,p.estoqueMin,p.custoCompra,p.precoVenda]));
    res.innerHTML = ps.length ? `<table class="table"><thead><tr><th>${t('Produto')}</th><th>${t('Estoque')}</th><th>Mínimo</th><th>${t('Custo')}</th><th>${t('Preço')}</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.nome)}</td><td>${p.estoqueAtual}</td><td>${p.estoqueMin}</td><td>${money(p.custoCompra)}</td><td>${money(p.precoVenda)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">—</div>';
    buildRelChart(ps.map(p=>p.nome),[{label:'Estoque',data:ps.map(p=>p.estoqueAtual),backgroundColor:'rgba(124,58,237,.7)',borderRadius:6}]);
  }
  if(tipo==='socios'){
    const ss = DATA.socios;
    relCsvRows=[['Socio','Participacao','Receitas','Despesas','Saldo']].concat(ss.map(s=>{ const t=socioTotals(s); return [s.nome,s.participacao,t.r,t.d,t.saldo]; }));
    res.innerHTML = ss.length ? `<table class="table"><thead><tr><th>${t('Sócio')}</th><th>${t('Receitas')}</th><th>${t('Despesas')}</th><th>${t('Saldo')}</th></tr></thead><tbody>${ss.map(s=>{ const t=socioTotals(s); return `<tr><td>${esc(s.nome)}</td><td class="text-success">${money(t.r)}</td><td class="text-danger">${money(t.d)}</td><td>${money(t.saldo)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">—</div>';
    buildRelChart(ss.map(s=>s.nome),[
      {label:'Receitas',data:ss.map(s=>socioTotals(s).r),backgroundColor:'rgba(34,197,94,.7)',borderRadius:6},
      {label:'Despesas',data:ss.map(s=>socioTotals(s).d),backgroundColor:'rgba(239,68,68,.7)',borderRadius:6}]);
  }
}
function buildRelChart(labels,datasets){
  relChartInst = new Chart(document.getElementById('relChart'),{type:'bar',data:{labels,datasets},options:{plugins:{legend:{labels:{color:'#a897d1'}}},scales:{x:{ticks:{color:'#a897d1'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#a897d1'},grid:{color:'rgba(255,255,255,.05)'}}}}});
}
function exportCSV(){
  if(!relCsvRows.length){ toast('Gere um relatório primeiro','error'); return; }
  const csv = relCsvRows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='relatorio_'+document.getElementById('relTipo').value+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
